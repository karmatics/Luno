<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Luno Workspace</title>
  <link rel="icon" type="image/png" href="./assets/lunologo.png">
  <style>
    html, body {
      background: #0d1117 !important;
      color: #c9d1d9;
      font-family: monospace;
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }
    #app-root {
      min-height: 100vh;
      width: 100%;
    }
  </style>

  <!-- Preload Acorn AST parser directly via local vendor with CDN fallback -->
  <script src="/Luno/vendor/acorn.js" onerror="this.onerror=null; this.src='https://cdn.jsdelivr.net/npm/acorn@8.11.3/dist/acorn.min.js';"></script>
  <script src="./app/acorn.js"></script>

  <!-- Single entry loader: reads dependencies dynamically from luno.json -->
  <script src="/Library/LunoLoader.js" onerror="this.onerror=null; (function(el){ var u=(window.location.hostname.endsWith('.github.io')?window.location.hostname.split('.')[0]:'karmatics'); el.src='https://'+u+'.github.io/Library/LunoLoader.js'; el.onerror=function(){ el.onerror=null; el.src='https://karmatics.github.io/Library/LunoLoader.js'; }; })(this);"></script>
</head>
<body>
  <div id="app-root"></div>
  <script>
    document.addEventListener("DOMContentLoaded", async function() {
      if (typeof LunoLoader !== "undefined") {
        await LunoLoader.loadApp("app-root");
      }
    });
  </script>
</body>
</html>
